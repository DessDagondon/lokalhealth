{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm p-4">
            <h4 class="fw-bold mb-2">Set your password</h4>
            <p class="text-muted small">Your administrator provided a temporary password. Choose a private password to continue.</p>
            <form method="post">
                <div class="mb-3">
                    <label for="password" class="form-label">New password</label>
                    <input id="password" name="password" type="password" class="form-control" minlength="8" required autocomplete="new-password">
                </div>
                <div class="mb-4">
                    <label for="confirmation" class="form-label">Confirm password</label>
                    <input id="confirmation" name="confirmation" type="password" class="form-control" minlength="8" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Update password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
